name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint and offline tests
    # Pinned on purpose: the ubuntu-latest label migrates to Ubuntu 26.04 in
    # November 2026 (actions/runner-images#14748). Bump it deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua 5.1 + luacheck + busted + stylua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 luarocks lua-check
          sudo luarocks install busted
          curl -sL https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip -o /tmp/stylua.zip
          unzip -o /tmp/stylua.zip -d /tmp/stylua
          sudo install -m 0755 /tmp/stylua/stylua /usr/local/bin/stylua

      - name: make check (stylua + luacheck + .toc + busted)
        run: make check
