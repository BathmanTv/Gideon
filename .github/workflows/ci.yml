name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Lua 5.1 + luacheck + busted + stylua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 luajit luarocks lua-check
          sudo luarocks install busted
          sudo luarocks install luafilesystem
          curl -sL https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip -o /tmp/stylua.zip
          unzip -o /tmp/stylua.zip -d /tmp/stylua
          sudo install -m 0755 /tmp/stylua/stylua /usr/local/bin/stylua

      - name: Format (stylua --check)
        run: stylua --check .

      - name: Lint (luacheck)
        run: luacheck .

      - name: Tests unitaires hors jeu (busted)
        run: busted

      - name: Verification du .toc
        run: python3 tools/check_toc.py GideonRaid.toc
