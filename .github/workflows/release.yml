name: Release

# The packager CREATES the GitHub Release and attaches the addon zip to it.
# The workflow token therefore needs write access: without this block the job
# fails with "Resource not accessible by integration" (403) even when every
# other step passes.
permissions:
  contents: write

# This repository holds the addon at its ROOT. That is a hard requirement of the
# BigWigs packager: it needs a .git directory inside the folder it is given, so
# the folder it is given must be the repository root. That is why no -t flag is
# used here, and why the bot / addon separation is enforced by using two separate
# repositories rather than subfolders in one repository.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Gate: never publish when the offline test suite fails.
  tests:
    name: Tests before release
    # Pinned on purpose: the ubuntu-latest label migrates to Ubuntu 26.04 in
    # November 2026 (actions/runner-images#14748). Bump it deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua 5.1 + luacheck + busted + stylua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 luarocks lua-check
          sudo luarocks install busted
          curl -sL https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip -o /tmp/stylua.zip
          unzip -o /tmp/stylua.zip -d /tmp/stylua
          sudo install -m 0755 /tmp/stylua/stylua /usr/local/bin/stylua

      - name: Offline checks
        run: make check

  release:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Publishing policy (one publisher per destination, to avoid duplicate files):
      #   GitHub Releases : always. GITHUB_OAUTH is provided by Actions, nothing to
      #                     create. This is the release WowUp uses to install and
      #                     auto-update the addon.
      #   CurseForge      : handled by CurseForge itself ("Package tagged commits" in
      #                     the project settings), so no CF_API_TOKEN is needed here.
      #   Wago Addons     : enable later by adding the WAGO_API_TOKEN secret and a
      #                     X-Wago-ID in the .toc.
      - name: Package and publish (BigWigs packager)
        uses: BigWigsMods/packager@v2
        with:
          args: -g 12.1.0
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
